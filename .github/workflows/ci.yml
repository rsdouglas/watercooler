name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # See janee #17 — rm lock file to work around npm optional deps bug across platforms
      - run: rm -f package-lock.json && npm install
      - run: npm run build
      - run: npm test
